<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Launch</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f4f4f4; padding: 20px 0;">
    <tr>
      <td align="center">
        <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
          
          <!-- HEADER -->
          <tr>
            <td align="center" style="padding: 20px; background-color: #111111;">
              <img src="https://picsum.photos/140/40" alt="Brand Logo" width="110" style="display: block;">
            </td>
          </tr>

          <!-- BANNER IMAGE -->
          <tr>
            <td>
              <img src="https://picsum.photos/600/250" alt="Promo Banner" width="100%" style="display: block;">
            </td>
          </tr>

          <!-- BODY CONTENT -->
          <tr>
            <td style="padding: 30px 20px; text-align: center;">
              <h2 style="color: #111; font-size: 22px;">Summer Collection Is Here</h2>
              <p style="color: #666; font-size: 15px; line-height: 1.5;">Upgrade your wardrobe with our latest arrivals. Premium quality made for everyday comfort.</p>
              
              <!-- Product Image Row -->
              <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-top: 20px;">
                <tr>
                  <td width="50%" align="center" style="padding: 10px;">
                    <img src="https://picsum.photos/260/260" alt="Product 1" width="100%" style="border-radius: 4px; display: block;">
                    <p style="font-size: 14px; color: #333; margin: 10px 0 5px 0;">Classic Item</p>
                  </td>
                  <td width="50%" align="center" style="padding: 10px;">
                    <img src="https://picsum.photos/260/260" alt="Product 2" width="100%" style="border-radius: 4px; display: block;">
                    <p style="font-size: 14px; color: #333; margin: 10px 0 5px 0;">New Arrival</p>
                  </td>
                </tr>
              </table>

              <table border="0" cellspacing="0" cellpadding="0" style="margin: 20px auto;">
                <tr>
                  <td align="center" style="background-color: #28a745; border-radius: 4px;">
                    <a href="#" target="_blank" style="font-size: 16px; font-family: Arial, sans-serif; color: #ffffff; text-decoration: none; padding: 12px 30px; display: inline-block;">Shop Collection</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="padding: 20px; background-color: #f8f9fa; text-align: center; border-top: 1px solid #eeeeee;">
              <p style="color: #333; font-size: 13px; font-weight: bold; margin: 0 0 5px 0;">Store Support</p>
              <p style="color: #666; font-size: 12px; margin: 0 0 10px 0;">Questions? Contact us at support@example.com</p>
              <p style="color: #aaaaaa; font-size: 12px; margin: 0 0 5px 0;">© 2026 Store Brand. All rights reserved.</p>
              <p style="color: #aaaaaa; font-size: 12px; margin: 0;"><a href="#" style="color: #666666; text-decoration: underline;">Unsubscribe</a> from this list.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
