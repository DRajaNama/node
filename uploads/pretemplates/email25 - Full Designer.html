<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webinar Invitation</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0f172a; font-family: Arial, sans-serif;">
    <center style="width: 100%; background-color: #0f172a; padding: 30px 0;">
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; background-color: #1e293b; border-radius: 12px; overflow: hidden;">
            
            <!-- HEADER -->
            <tr>
                <td align="center" style="padding: 30px 20px 10px 20px; background-color: #1e293b;">
                    <span style="color: #818cf8; font-size: 13px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;">Live Masterclass</span>
                </td>
            </tr>

            <!-- HERO TITLE -->
            <tr>
                <td align="center" style="padding: 10px 30px 20px 30px;">
                    <h1 style="color: #ffffff; font-size: 28px; font-weight: 800; margin: 0 0 15px 0; line-height: 1.3;">Scaling B2B Sales with AI in 2026</h1>
                    <p style="color: #94a3b8; font-size: 15px; margin: 0; line-height: 1.5;">Join industry leaders to discover practical strategies for automating outreach and conversion.</p>
                </td>
            </tr>

            <!-- EVENT DETAILS CARD -->
            <tr>
                <td align="center" style="padding: 10px 30px 30px 30px;">
                    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #0f172a; border-radius: 8px; padding: 20px;">
                        <tr>
                            <td align="center" width="50%" style="border-right: 1px solid #334155; padding: 10px;">
                                <p style="color: #94a3b8; font-size: 12px; margin: 0 0 5px 0; text-transform: uppercase;">DATE</p>
                                <p style="color: #ffffff; font-size: 16px; font-weight: bold; margin: 0;">Thursday, Sep 15</p>
                            </td>
                            <td align="center" width="50%" style="padding: 10px;">
                                <p style="color: #94a3b8; font-size: 12px; margin: 0 0 5px 0; text-transform: uppercase;">TIME</p>
                                <p style="color: #ffffff; font-size: 16px; font-weight: bold; margin: 0;">2:00 PM EST</p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <!-- CTA BUTTON -->
            <tr>
                <td align="center" style="padding: 0 30px 40px 30px;">
                    <a href="#" style="background-color: #6366f1; color: #ffffff; text-decoration: none; padding: 16px 36px; border-radius: 8px; font-weight: bold; font-size: 16px; display: inline-block;">Reserve My Spot</a>
                </td>
            </tr>

            <!-- FOOTER -->
            <tr>
                <td align="center" style="background-color: #0f172a; padding: 25px 20px; border-top: 1px solid #334155;">
                    <p style="color: #64748b; font-size: 12px; margin: 0 0 10px 0;">Organized by GrowthSummit</p>
                    <p style="margin: 0;">
                        <a href="#" style="color: #94a3b8; font-size: 12px; text-decoration: underline; margin: 0 8px;">Add to Calendar</a>
                        <a href="#" style="color: #94a3b8; font-size: 12px; text-decoration: underline; margin: 0 8px;">Unsubscribe</a>
                    </p>
                </td>
            </tr>

        </table>
    </center>
</body>
</html>
